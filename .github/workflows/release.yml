name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: >
      github.event.pull_request.merged == true &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Determine version from branch name
        id: version
        run: |
          BRANCH="${{ github.head_ref }}"
          VERSION="${BRANCH#release/}"
          VERSION="${VERSION#hotfix/}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Branch name '$BRANCH' does not end in a semver X.Y.Z suffix" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag release
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        run: gh release create ${{ steps.version.outputs.tag }} --generate-notes

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Deploy backend to Fly.io
        working-directory: backend
        run: flyctl deploy --app deepread-worker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build mobile release APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Attach APK to release
        run: gh release upload ${{ steps.version.outputs.tag }} mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Open main -> develop sync PR
        run: |
          git fetch origin develop
          if [ "$(git rev-list origin/develop..HEAD --count)" -gt 0 ]; then
            gh pr create \
              --base develop \
              --head main \
              --title "sync: merge ${{ steps.version.outputs.tag }} into develop" \
              --body "Automated back-merge of \`main\` into \`develop\` after releasing ${{ steps.version.outputs.tag }}." \
              || echo "Sync PR already exists or nothing to merge"
          else
            echo "develop is already up to date with main, skipping sync PR"
          fi
