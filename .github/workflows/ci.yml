name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # SAFETY INVARIANT: gate downstream jobs with a job-level `if: needs.changes.outputs.*`,
  # never with a workflow-level `on.pull_request.paths`/`on.push.paths` filter. A job skipped
  # via job-level `if:` reports conclusion `skipped`, which satisfies a required status check.
  # A workflow that never triggers at all (path-filtered at the `on:` level) leaves a required
  # check with no run reported for that commit, which blocks merging forever. Do not "simplify"
  # this job away in favor of `on.<event>.paths`.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}
      - run: playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: python -m pytest

  mobile-test:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v6
        with:
          path: mobile/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test

  mobile-android-build:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v6
        with:
          path: mobile/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
      - uses: actions/cache/restore@v6
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/android/**/*.gradle*', 'mobile/android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - run: flutter pub get
      - run: dart run build_runner build
      - name: Compile-check the Android build
        # flutter analyze/flutter test never touch native/Gradle compilation, so a change
        # that silently breaks it (e.g. a pubspec.lock bump breaking a Kotlin plugin's
        # compilation) would otherwise go undetected until a real release build — this
        # repo hit exactly that failure mode once, in the v0.6.0 release. --debug uses the
        # same compile step as release but skips R8/minification/signing, so it needs no
        # release secrets and runs in parallel with mobile-test instead of serialized after
        # it, with a Gradle cache to keep it fast.
        run: flutter build apk --debug
      - uses: actions/cache/save@v6
        # Only save on push to develop (this is what warms the cache other branches restore
        # from — see CLAUDE.md's CI section), and only when restore didn't already get an exact
        # key hit, mirroring what the old combined actions/cache@v6 step did internally. Key
        # here must stay identical to the restore step's above, or an edit to one silently
        # orphans the other.
        if: github.event_name == 'push' && steps.gradle-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/android/**/*.gradle*', 'mobile/android/gradle.properties') }}

  mobile-ios-compile-check:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v6
        with:
          path: mobile/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
      - run: flutter pub get
      - run: dart run build_runner build
      - name: Compile-check the iOS build
        # Same rationale as mobile-android-build's compile-check: flutter
        # analyze/flutter test never touch native Swift compilation, so a
        # plugin bump or native-code change (e.g. AppDelegate.swift) that
        # breaks the iOS build would otherwise only surface at release-build
        # time — which this project currently has no pipeline to even attempt
        # for iOS. --debug mirrors the Android job (same compile step as
        # release, skips extra work); --no-codesign skips code-signing, which
        # needs an Apple signing identity/certs not available in CI.
        run: flutter build ios --debug --no-codesign
