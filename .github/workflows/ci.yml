name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}
      - run: playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: python -m pytest

  mobile-test:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v6
        with:
          path: mobile/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test

  mobile-android-build:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v6
        with:
          path: mobile/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - run: flutter pub get
      - run: dart run build_runner build
      - name: Compile-check the Android build (single ABI)
        # Same rationale as before (catches native/Gradle build breakage flutter
        # analyze/flutter test can't see) but now runs in parallel with mobile-test
        # instead of serialized after it, with a Gradle cache, and building only
        # arm64 instead of the default multi-ABI fat APK — this is a CI compile
        # check, not a distributed artifact, and this app has no ABI-specific
        # native/NDK code (just Kotlin plugins, which compile the same per ABI).
        run: flutter build apk --debug --target-platform android-arm64

  mobile-ios-compile-check:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v6
        with:
          path: mobile/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
      - run: flutter pub get
      - run: dart run build_runner build
      - name: Compile-check the iOS build
        # Same rationale as mobile-test's Android compile-check: flutter
        # analyze/flutter test never touch native Swift compilation, so a
        # plugin bump or native-code change (e.g. AppDelegate.swift) that
        # breaks the iOS build would otherwise only surface at release-build
        # time — which this project currently has no pipeline to even attempt
        # for iOS. --debug mirrors the Android job (same compile step as
        # release, skips extra work); --no-codesign skips code-signing, which
        # needs an Apple signing identity/certs not available in CI.
        run: flutter build ios --debug --no-codesign
