[project]
name = "deepread-worker"
version = "0.1.0"
description = "Feed poller + headless-render worker for deepread"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.48",
  "feedparser>=6.0",
  "httpx>=0.27",
  "nh3>=0.2",
  "supabase>=2.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deepread_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
# First mypy adoption on this codebase — no library stubs exist for
# feedparser/nh3/etc, and chasing every third-party stub down isn't this
# change's scope. Revisit per-package once stubs are worth pinning down.
ignore_missing_imports = true
